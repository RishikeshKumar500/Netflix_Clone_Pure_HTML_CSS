<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero">
        <div class="overlay">
            <nav>
                <div class="leftNav">
                    <img src="Assets/icon.svg" alt="svg" height="40">
                </div>
                <div class="rightNav">
                    <button>English</button>
                    <button>Sign In</button>
                </div>
            </nav>
            <main>
                <div class="cont">
                    <h1>Unlimited movies, shows, and more</h1>
                    <h3>Starts at ₹149. Cancel at any time.</h3>
                    <p>Ready to watch? Enter your email to create or restart your membership.</p>
                    <div class="inbox">
                        <input type="text" name="" id="" placeholder="Email Address">
                        <button>Get Started</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <section class="cards">
        <div class="card">
            <img src="Assets/1.webp" alt="1">
        </div>
        <div class="card">
            <img src="Assets/2.webp" alt="2">
        </div>
        <div class="card">
            <img src="Assets/3.webp" alt="3">
        </div>
        <div class="card">
            <img src="Assets/4.webp" alt="4">
        </div>
        <div class="card">
            <img src="Assets/5.webp" alt="5">
        </div>
        <div class="card">
            <img src="Assets/6.webp" alt="6">
        </div>
    </section>
    <section class="faqs">
        <h2>Frequently Asked Questions</h2>
        <div class="buttons">
            <button>What is Netflix?</button>
            <button>How much does Netflix cost?</button>
            <button>Where can i watch?</button>
            <button>How do i cancel?</button>
            <button>What can i watch on Netflix?</button>
            <button>Is Netflix good for kids?</button>
        </div>
    </section>
    <footer>Netlfix India Clone 2026 dummy rights</footer>
</body>

</html>
